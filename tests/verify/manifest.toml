# The verification corpus.
#
# Every sealed rung exit criterion is a command that runs this file through
# `cargo xtask verify`. An entry states what would FALSIFY it; there is no kind
# meaning "run it and see".
#
#   match     stdout byte-identical to the pinned node, plus stderr CLASS and
#             exit-status class. The external oracle.
#   refused   the compiler must exit 2 naming a declared ESC-Ennn code.
#   artifact  a property of the built binary (e.g. a symbol that must be absent).
#
# xfail follows the same three rules as tests/integration/xfail.txt: failing while
# listed is expected, failing unlisted is a hard failure, and PASSING while listed
# is ALSO a hard failure — that is how a fix announces itself.

node_pin = "v24.14.0"

# --- Arithmetic. These were the flagship defect and now pass; they stay as
# --- regression cover, because the unsound rewrite is two lines from returning.
[[entry]]
id = "arith-div-half"
program = "tests/integration/fixtures/arith-div-half.js"
kind = "match"
note = "7/2. Printed 3 until R1-03 deleted the I32 arithmetic specialisation."

[[entry]]
id = "arith-div-by-zero"
program = "tests/integration/fixtures/arith-div-by-zero.js"
kind = "match"
note = "1/0. Died with SIGILL (exit 132) until R1-03; f64 division does not trap."

[[entry]]
id = "arith-mod-by-zero"
program = "tests/integration/fixtures/arith-mod-by-zero.js"
kind = "match"
note = "9%0. Died with SIGFPE (exit 136) until R1-03."

[[entry]]
id = "arith-mul-overflow"
program = "tests/integration/fixtures/arith-mul-overflow.js"
kind = "match"
note = "1e5*1e5 wrapped to 1410065408 under 32-bit multiply."

# --- The artifact claim. The one differentiator that is true today, and it is
# --- true by accident until something asserts it.
[[entry]]
id = "no-interpreter-in-artifact"
program = "tests/integration/fixtures/arith-div-half.js"
kind = "artifact"
absent_symbols = ["cranelift_codegen", "oxc_parser"]
note = "\"this binary contains no interpreter\" — 0 cranelift and 0 oxc symbols."

# --- Spread over a non-array iterable. The first three were the R1-05a defect
# --- and now pass; they stay as regression cover, because the fix is a single
# --- InternalKind check away from being reverted. The fourth is NOT the same
# --- defect and is registered against ESC-102 — see its note.
[[entry]]
id = "iter-spread-set"
program = "tests/verify/programs/iter-spread-set.js"
kind = "match"
note = "[...new Set([1,1,2])].length gives 0; node gives 2."

[[entry]]
id = "iter-spread-map"
program = "tests/verify/programs/iter-spread-map.js"
kind = "match"
note = "[...new Map([[1,2],[3,4]])].length gives 0; node gives 2."

[[entry]]
id = "iter-spread-generator"
program = "tests/verify/programs/iter-spread-generator.js"
kind = "match"
note = "[...g()].length gives 0; node gives 2. for-of over the same generator works."

[[entry]]
id = "iter-spread-call-args"
program = "tests/verify/programs/iter-spread-call-args.js"
kind = "match"
note = "Math.max(...new Set([1,5,3])) gives -Infinity. NOT R1-05a: Math.max(...[1,5,3]) fails identically with a plain array."

