# --- R1-05b · `console` is only a call site, not a value (ESC-35).
# --- The four below are the defect. `typeof-builtin-method` above is the fifth
# --- and predates this block. Boundary entries follow: they pass today and are
# --- what says the fix belongs in global RESOLUTION, not in call lowering.
[[entry]]
id = "console-typeof-object"
program = "tests/verify/programs/console-typeof-object.js"
kind = "match"
note = "node prints \"object\"; esc prints \"undefined\" at exit 0. The silent-wrong-answer half."

[[entry]]
id = "console-method-as-value"
program = "tests/verify/programs/console-method-as-value.js"
kind = "match"
note = "node prints \"function\"; esc exits 1 with zero bytes on both streams."

[[entry]]
id = "console-feature-detect"
program = "tests/verify/programs/console-feature-detect.js"
kind = "match"
note = "node prints \"has console\"; esc prints \"no console\" at exit 0. Exits clean, so it looks like it worked."

[[entry]]
id = "console-direct-call"
program = "tests/verify/programs/console-direct-call.js"
kind = "match"
note = "console.log + console.error in CALL position. Already correct — the compile-time fast path this ticket must not delete."

[[entry]]
id = "builtin-typeof-math-floor"
program = "tests/verify/programs/builtin-typeof-math-floor.js"
kind = "match"
note = "typeof Math.floor / [].push / \"\".slice. Already correct, so this is console-specific and not a general builtin-method-as-value defect. Whatever Math does is the model."

# --- R1-05e · `with` inside a function (ESC-82). Top-level `with` works and
# --- `with` over a PARAMETER works; only `with` over an outer binding inside a
# --- function fails. That pair is the narrowing — measured 2026-08-13.
[[entry]]
id = "with-fn-return"
program = "tests/verify/programs/with-fn-return.js"
kind = "match"
note = "node prints 1; esc exits 1 having written nothing."

[[entry]]
id = "with-fn-stmt"
program = "tests/verify/programs/with-fn-stmt.js"
kind = "match"
note = "node prints \"inside\" then \"done\"; esc exits 1 with no output. Even the statement AFTER the with-block is lost."

[[entry]]
