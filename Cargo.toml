[workspace]
resolver = "2"
members = [
    # Developer tooling: `cargo xtask verify` is the corpus runner every
    # sealed rung exit criterion invokes. Not published.
    "xtask",
    # Foundation (language-agnostic, reusable)
    "crates/common",
    "crates/arena",
    "crates/interner",
    "crates/nanbox",
    "crates/strings",

    # IR (the spine)
    "crates/ir",

    # Frontend (JS/TS specific)
    "crates/parser",
    "crates/desugar",
    "crates/types",
    "crates/escape",
    "crates/shapes",
    "crates/generator_transform",
    "crates/memory",

    # Backends
    "crates/cranelift",
    "crates/llvm",
    "crates/linker",

    # Runtime
    "crates/runtime",
    "crates/host",
    "crates/stdlib",
    "crates/exceptions",
    "crates/eval",
    "crates/cycles",
    "crates/regexp",

    # Modules & Incremental
    "crates/modules",


    # Tooling
    "crates/diagnostics",
    "crates/driver",
    "crates/cli",
    "crates/repl",

    # Testing
    "crates/test262",
]

[workspace.package]
version = "0.9.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/papilionem/escompiler-dev"

[workspace.dependencies]
# Foundation
bumpalo = { version = "3", features = ["collections"] }
lasso = { version = "0.7", features = ["multi-threaded"] }

# Parsing
oxc_parser = "0.116"
oxc_ast = "0.116"
oxc_span = "0.116"
oxc_resolver = "11"
oxc_allocator = "0.116"
oxc_diagnostics = "0.116"

# Backends
inkwell = { version = "0.5", features = ["llvm18-0"] }
cranelift-frontend = "0.129"
cranelift-codegen = "0.129"
cranelift-object = "0.129"
cranelift-jit = "0.129"
cranelift-module = "0.129"
target-lexicon = "0.13"

# Diagnostics
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
fancy-regex = "0.14"
rayon = "1"
notify = "8"
sourcemap = "9"
tikv-jemallocator = "0.6"
rustyline = "17"

# Platform / system
getrandom = "0.2"
libc = "0.2"

# Dev/test
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }  # 0.8 available but has breaking changes; defer
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates (internal dependencies)
strings = { path = "crates/strings" }
common = { path = "crates/common" }
arena = { path = "crates/arena" }
interner = { path = "crates/interner" }
nanbox = { path = "crates/nanbox" }
zone = { path = "crates/zone" }
ir = { path = "crates/ir" }
parser = { path = "crates/parser" }
desugar = { path = "crates/desugar" }
types = { path = "crates/types" }
escape = { path = "crates/escape" }
shapes = { path = "crates/shapes" }
generator_transform = { path = "crates/generator_transform" }
memory = { path = "crates/memory" }
cranelift = { path = "crates/cranelift" }
llvm = { path = "crates/llvm" }
linker = { path = "crates/linker" }
runtime = { path = "crates/runtime" }
host = { path = "crates/host" }
stdlib = { path = "crates/stdlib" }
exceptions = { path = "crates/exceptions" }
eval = { path = "crates/eval" }
cycles = { path = "crates/cycles" }
modules = { path = "crates/modules" }
diagnostics = { path = "crates/diagnostics" }
driver = { path = "crates/driver" }
cli = { path = "crates/cli" }
repl = { path = "crates/repl" }
regexp = { path = "crates/regexp" }
test262 = { path = "crates/test262" }
